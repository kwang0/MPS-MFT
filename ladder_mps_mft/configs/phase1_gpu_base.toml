[model]
L = 64
t = 1.0
U = 8.0
V = -0.2
t0 = 1.1
tp = 0.1
density = 0.9375
mu_initial = 1.0
r_range = 4
geometry = "cubic_frustrated"

[pair_binding]
registry = "data/E_p_values.csv"
allow_interpolation = true

[dmrg]
nsweeps = 12
maxdim = 200
cutoff = 1.0e-10
energy_tol = 1.0e-8
eigsolve_krylovdim = 8
max_time_seconds = 41400.0
output_level = 1
mu_density_tol = 2.0e-4
mu_max_iterations = 16
mu_bracket_step = 0.05
mu_bracket_growth = 2.0
mu_interval_tol = 1.0e-6

[mixing]
method = "anderson"
damping = 0.5
minimum_damping = 0.05
maximum_damping = 0.8
memory = 5
regularization = 1.0e-10
adaptive = true

[convergence]
field_abs_tol = 1.0e-6
field_rel_tol = 5.0e-3
density_tol = 2.0e-4
variational_energy_tol = 1.0e-7
hamiltonian_identity_tol = 1.0e-9
effective_energy_consistency_tol = 1.0e-6
stable_iterations = 2
max_period = 8
period_repeats = 3
period_abs_tol = 2.0e-6
period_rel_tol = 1.0e-2
unmixed_cycle_probe = true
probe_max_period = 2
probe_iterations = 20
accepted_periods = [1, 2]
orbit_bulk_fraction = 0.5
cycle_action = "continue"
stagnation_window = 10
stagnation_min_relative_improvement = 1.0e-2
divergence_factor = 8.0

[runtime]
backend = "gpu"
tensor_scalar_type = "float64"
blas_threads = 1
strided_threads = 1
threaded_blocksparse = false
conserve_sz = false
conserve_nfparity = false

[run]
output_directory = "output/phase1_gpu/UNPREPARED"
branch_label = "unprepared"
preparation = "independent_seed"
direction = "none"
seed_label = "unprepared"
random_seed = 1
initial_seed = "pairing"
initial_amplitude = 1.0e-3
max_iterations = 80
save_every = 1
require_accepted_solution = false
allow_unbound_ep = false
quick_diagnostics = true
full_pair_correlations = false
