[model]
L = 2
t = 1.0
U = 2.0
V = 0.0
t0 = 1.0
tp = 0.02
density = 1.0
mu_initial = 0.0
r_range = 1
geometry = "square"

[pair_binding]
registry = "test/fixtures/E_p_tiny.csv"

[dmrg]
nsweeps = 1
maxdim = 4
cutoff = 1.0e-8
energy_tol = 0.0
eigsolve_krylovdim = 4
max_time_seconds = 180.0
output_level = 0

[runtime]
backend = "cpu"
blas_threads = 1
strided_threads = 1
threaded_blocksparse = false

[run]
output_directory = "output"
branch_label = "phase0_script_smoke"
preparation = "deterministic_pairing_seed"
direction = "none"
seed_label = "tiny"
random_seed = 7
initial_seed = "pairing"
initial_amplitude = 1.0e-3
max_iterations = 1
require_accepted_solution = false
quick_diagnostics = false

[backbone]
chi_ladder = [4, 8]
pre_relax_maxdim = 2
pre_relax_sweeps = 4
stage_sweeps = 2
minimum_sweeps_at_maxdim = 2
cutoff = 1.0e-8
energy_tol = 0.0
noise_floor = 1.0e-8
eigsolve_krylovdim = 4
output_level = 0
maximum_sector_seconds = 180.0
last_five_energy_tol = 1.0
random_seed = 7

[stage1]
top_modes = 2
covariance_psd_tol = 1.0e-7
bulk_edge_fractions = [0.0]
pair_classes = ["onsite0", "onsite1", "rung", "leg0", "leg1"]

[stage2]
field_strength = 1.0e-3
validation_field_strength = 5.0e-4
charge_even_modes = [1]
spin_odd_modes = [1]
pair_form_factors = ["onsite_s", "rung_s", "leg_s", "extended_s", "d_wave"]
covariance_candidates = ["charge:even:1", "charge:odd:1", "spin:even:1"]
geometries = ["cubic_frustrated", "cubic_unfrustrated", "square"]
maxdim = 8
normal_reference_sweeps = 8
pair_reference_sweeps = 4
probe_sweeps = 4
validation_sweeps = 4
minimum_convergence_sweep = 2
cutoff = 1.0e-8
energy_tol = 0.0
noise_floor = 0.0
last_five_energy_tol = 10.0
density_tol = 1.0
orthogonalization_tol = 1.0e-10
reciprocity_relative_tol = 10.0
cross_block_relative_tol = 10.0
linearity_relative_tol = 10.0
top_validation_modes = 2
eigsolve_krylovdim = 4
output_level = 0
maximum_job_seconds = 180.0
